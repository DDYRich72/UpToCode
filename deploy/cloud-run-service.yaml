apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: uptocode-mcp
  annotations:
    run.googleapis.com/description: Stateless UpToCode private-beta MCP service
    # Judges authenticate at the application boundary with an UpToCode bearer key.
    # Cloud Run IAM must not consume the same Authorization header first.
    run.googleapis.com/invoker-iam-disabled: "true"
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 4
      timeoutSeconds: 300
      serviceAccountName: uptocode-mcp-runtime
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/uptocode/mcp@IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: UPTOCODE_RATE_LIMIT_PER_MINUTE
              value: "30"
            - name: UPTOCODE_HOSTED_JUDGMENT
              value: "false"
            - name: UPTOCODE_HOSTED_ALLOWED_HOSTS
              value: "PUBLIC_DNS_VALUE"
            - name: UPTOCODE_API_KEY_HASHES
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: uptocode-api-key-hashes
          startupProbe:
            httpGet:
              path: /readyz
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
            periodSeconds: 30
