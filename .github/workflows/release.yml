name: Release Candidate Artifacts

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    environment: release-approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install release environment
        run: |
          python -m pip install --upgrade "pip>=26.1.2" build cyclonedx-bom
          python -m pip install -e ".[test]"
      - run: python -m ruff check archagent_audit tests scripts
      - run: python -m mypy archagent_audit
      - run: python -m coverage run --branch -m pytest -q
      - run: python -m coverage report --fail-under=85
      - run: python scripts/acceptance.py
      - run: python scripts/compliance.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm exec tsc -- --noEmit
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: Build release artifacts
        run: |
          python -m build
          cyclonedx-py environment --output-file dist/sbom.json
          cp .archagent-audit/architecture-compliance.json dist/architecture-compliance.json
      - name: Generate site SBOM
        run: npm sbom --sbom-format cyclonedx > ../dist/site-sbom.json
        working-directory: web
      - name: Retain release-candidate artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-candidate-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*"

      # PyPI publication is intentionally absent. D006 defers it to post-event Phase 7.
