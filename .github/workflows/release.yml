name: Release Candidate Artifacts

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    environment: release-approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install release environment
        run: |
          python -m pip install --upgrade "pip>=26.1.2" build cyclonedx-bom
          python -m pip install -e ".[test]"
      - run: python -m ruff check archagent_audit tests scripts
      - run: python -m mypy archagent_audit
      - run: python -m coverage run --branch -m pytest -q
      - run: python -m coverage report --fail-under=85
      - run: python scripts/acceptance.py
      - run: python scripts/compliance.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm exec tsc -- --noEmit
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: Build release artifacts
        run: |
          python -m build
          cyclonedx-py environment --output-file dist/sbom.json
          cp .archagent-audit/architecture-compliance.json dist/architecture-compliance.json
      - name: Generate site SBOM
        run: npm sbom --sbom-format cyclonedx > ../dist/site-sbom.json
        working-directory: web
      - name: Retain release-candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"

      # PyPI publication is intentionally absent. D006 defers it to post-event Phase 7.
