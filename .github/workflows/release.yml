name: Release Candidate Artifacts

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    environment: release-approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install release environment
        run: |
          python -m pip install --upgrade "pip>=26.1.2" build cyclonedx-bom
          python -m pip install -e ".[test]"
      - run: python -m ruff check archagent_audit tests scripts
      - run: python -m mypy archagent_audit
      - run: python -m coverage run --branch -m pytest -q
      - run: python -m coverage report --fail-under=85
      - run: python scripts/acceptance.py
      - run: python scripts/compliance.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm exec tsc -- --noEmit
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: Build release artifacts
        run: |
          python -m build
          cyclonedx-py environment --output-file dist/sbom.json
          cp .archagent-audit/architecture-compliance.json dist/architecture-compliance.json
      - name: Generate site SBOM
        run: npm sbom --sbom-format cyclonedx > ../dist/site-sbom.json
        working-directory: web
      - name: Retain release-candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Attest public-repository artifacts
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: "dist/*"

      - name: Record private-repository attestation deferral
        if: github.event.repository.private
        run: |
          echo "### Artifact attestation deferred" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub artifact attestations are unavailable for user-owned private repositories." >> "$GITHUB_STEP_SUMMARY"
          echo "The retained RC artifacts and SBOMs remain available; signed/attested publication is deferred to Phase 7." >> "$GITHUB_STEP_SUMMARY"

      # PyPI publication and private-repository attestation are intentionally absent.
      # D006 defers signed/attested publication to post-event Phase 7.
