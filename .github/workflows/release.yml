name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    environment: release-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[test]" build cyclonedx-bom pip-audit
      - run: python -m pip_audit --local --skip-editable
      - run: python -m ruff check archagent_audit tests scripts
      - run: python -m mypy archagent_audit
      - run: python -m coverage run -m pytest -q
      - run: python -m coverage report
      - run: python scripts/acceptance.py
      - run: python scripts/compliance.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: python -m build
      - run: cyclonedx-py environment --output-file dist/sbom.json
      - run: npm sbom --sbom-format cyclonedx > ../dist/site-sbom.json
        working-directory: web
      - run: cp .archagent-audit/architecture-compliance.json dist/architecture-compliance.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - uses: pypa/gh-action-pypi-publish@release/v1
