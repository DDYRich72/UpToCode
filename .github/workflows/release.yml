name: Production Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install release environment
        run: |
          python -m pip install --upgrade "pip>=26.1.2" build cyclonedx-bom
          python -m pip install -e ".[test]"
      - name: Verify production tag matches package version
        run: |
          expected="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "${expected}"
      - run: python -m ruff check uptocode tests scripts
      - run: python -m mypy uptocode
      - run: python -m coverage run --branch -m pytest -q
      - run: python -m coverage report --fail-under=85
      - run: python scripts/acceptance.py
      - run: python scripts/compliance.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm exec tsc -- --noEmit
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: Build release artifacts
        run: |
          python -m build --outdir publish-dist
          mkdir release-evidence
          cyclonedx-py environment --output-file release-evidence/python-sbom.json
          cp .uptocode/architecture-compliance.json release-evidence/architecture-compliance.json
      - name: Generate site SBOM
        run: npm sbom --sbom-format cyclonedx > ../release-evidence/site-sbom.json
        working-directory: web
      - name: Verify release package contents
        run: |
          python -m pip install --force-reinstall publish-dist/uptocode-*.whl
          uptocode --version
          python -m uptocode --version
          python -m pip check
      - name: Retain production packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-packages-${{ github.ref_name }}
          path: publish-dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Retain SBOM and compliance evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-evidence-${{ github.ref_name }}
          path: release-evidence/*
          if-no-files-found: error
          retention-days: 90

  publish-pypi:
    name: Attest and publish to PyPI
    needs: build
    if: ${{ github.event.repository.private == false && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/uptocode/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: production-packages-${{ github.ref_name }}
          path: dist
      - name: Attest packages
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: "dist/*"
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist
