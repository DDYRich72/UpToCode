name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[test]"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --local --skip-editable
      - run: python -m ruff check archagent_audit tests scripts
      - run: python -m mypy archagent_audit
      - run: python -m coverage run -m pytest -q
      - run: python -m coverage report
      - run: python scripts/acceptance.py
      - run: python scripts/compliance.py

  package-and-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: docker build -t archagent-mcp:test .
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
