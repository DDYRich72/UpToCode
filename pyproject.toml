[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "archagent-audit"
version = "0.1.0"
description = "Architecture-quality analysis for Python agent applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ArchAgent contributors"}]
dependencies = [
  "mcp>=1.0,<2",
  "openai>=2.0,<3",
  "pathspec>=0.12,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
archagent-audit = "archagent_audit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["archagent_audit"]

[tool.hatch.build.targets.wheel.force-include]
"archagent_audit/rules/core.yml" = "archagent_audit/rules/core.yml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
