[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[project]
name = "uptocode"
version = "1.10.0"
description = "Evidence-backed architecture-quality analysis for Python and TypeScript agent applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "UpToCode contributors"}]
keywords = ["agents", "architecture", "mcp", "openai", "static-analysis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mcp==1.28.1",
  "jsonschema>=4.26.0,<5",
  "openai>=2.48.0,<3",
  "pathspec>=1.1.1,<2",
  "pydantic>=2.13.4,<3",
  "PyYAML>=6.0.3,<7",
  "rich>=15.0.0,<16",
  "starlette>=1.3.1,<2",
  "tree-sitter>=0.26.0,<0.27",
  "tree-sitter-typescript>=0.23.2,<0.24",
  "typer>=0.27.0,<1",
  "uvicorn>=0.51.0,<1",
]

[project.urls]
Homepage = "https://github.com/DDYRich72/UpToCode"
Documentation = "https://github.com/DDYRich72/UpToCode#readme"
Issues = "https://github.com/DDYRich72/UpToCode/issues"
Source = "https://github.com/DDYRich72/UpToCode"

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.15.2,<8",
  "mypy>=2.3.0,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.0,<1",
  "types-jsonschema>=4.26.0.20260518",
  "types-PyYAML>=6.0.12.20260724",
]

[project.scripts]
uptocode = "uptocode.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["uptocode"]

[tool.hatch.build.targets.wheel.force-include]
"uptocode/rules/core.yml" = "uptocode/rules/core.yml"

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/server.json",
  "/uptocode",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["uptocode"]

[[tool.mypy.overrides]]
module = [
  "jsonschema.*",
  "mcp.*",
  "openai.*",
  "rich.*",
  "starlette.*",
  "tree_sitter.*",
  "tree_sitter_typescript.*",
  "typer.*",
  "uvicorn.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["uptocode.cli", "uptocode.mcp_server"]
disable_error_code = ["untyped-decorator"]

[tool.coverage.run]
branch = true
source = ["uptocode"]

[tool.coverage.report]
fail_under = 85
