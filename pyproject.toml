[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "archagent-audit"
version = "1.0.0"
description = "Architecture-quality analysis for Python agent applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ArchAgent contributors"}]
dependencies = [
  "mcp==1.28.1",
  "jsonschema>=4.23,<5",
  "openai>=2.46,<3",
  "pathspec>=0.12,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.9,<16",
  "starlette>=1.3.1,<2",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0",
]

[project.scripts]
archagent-audit = "archagent_audit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["archagent_audit"]

[tool.hatch.build.targets.wheel.force-include]
"archagent_audit/rules/core.yml" = "archagent_audit/rules/core.yml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["archagent_audit"]

[[tool.mypy.overrides]]
module = [
  "jsonschema.*",
  "mcp.*",
  "openai.*",
  "rich.*",
  "starlette.*",
  "typer.*",
  "uvicorn.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["archagent_audit.cli", "archagent_audit.mcp_server"]
disable_error_code = ["untyped-decorator"]

[tool.coverage.run]
branch = true
source = ["archagent_audit"]

[tool.coverage.report]
fail_under = 85
